{% extends 'base.html' %}
{% load static %}

{% block title %}Experiencias · EcoRutas{% endblock %}

{% block content %}
<header class="topbar">
  <div class="topbar-left">
    <span class="brand-sm">EcoRutas</span>
  </div>
  <div class="topbar-right">
    <span id="user-info" class="user-info"></span>
    <span id="rol-badge" class="badge hidden"></span>
    <button id="create-btn" class="btn btn-primary hidden">+ Crear Experiencia</button>
    <button id="logout-btn" class="btn btn-ghost">Salir</button>
  </div>
</header>

<main class="container">
  <div id="alert" class="alert hidden"></div>

  <section class="toolbar">
    <input type="search" id="search-input" placeholder="Buscar experiencias por título, descripción o categoría...">
    <select id="ordering-select">
      <option value="">Orden por defecto</option>
      <option value="precio_unitario">Precio (asc)</option>
      <option value="-precio_unitario">Precio (desc)</option>
      <option value="-created_at">Más recientes</option>
    </select>
  </section>

  <section id="experiencias-grid" class="grid"></section>
  <p id="empty-state" class="empty hidden">No hay experiencias para mostrar.</p>
</main>

<!-- Modal Crear / Editar -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modal-title">Crear Experiencia</h2>
    <div id="modal-alert" class="alert hidden"></div>
    <form id="experiencia-form" novalidate>
      <input type="hidden" id="exp-id">

      <label for="exp-titulo">Título</label>
      <input type="text" id="exp-titulo" required>

      <label for="exp-descripcion">Descripción</label>
      <textarea id="exp-descripcion" rows="3" required></textarea>

      <div class="grid-2">
        <div>
          <label for="exp-categoria">Categoría</label>
          <select id="exp-categoria" required></select>
        </div>
        <div>
          <label for="exp-precio">Precio unitario</label>
          <input type="number" id="exp-precio" step="0.01" min="0" required>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="exp-latitud">Latitud</label>
          <input type="number" id="exp-latitud" step="0.000001" min="-90" max="90" required>
        </div>
        <div>
          <label for="exp-longitud">Longitud</label>
          <input type="number" id="exp-longitud" step="0.000001" min="-180" max="180" required>
        </div>
      </div>

      <label for="exp-estado">Estado</label>
      <select id="exp-estado">
        <option value="Activa">Activa</option>
        <option value="Inactiva">Inactiva</option>
        <option value="Borrador">Borrador</option>
      </select>

      <div class="modal-actions">
        <button type="button" id="cancel-btn" class="btn btn-ghost">Cancelar</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/experiencias.js' %}"></script>
{% endblock %}
